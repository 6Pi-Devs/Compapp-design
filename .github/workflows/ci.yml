name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Ensure generated files are not tracked
        run: |
          tracked="$(git ls-files '*.g.dart')"
          if [ -n "$tracked" ]; then
            echo "Generated files must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Test Widgetbook (use cases, goldens and semantics)
        id: wbtest
        working-directory: widgetbook
        run: flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: widgetbook/test/**/failures/*.png
          if-no-files-found: ignore

      # Linux is the only reference platform for CI goldens. A new atom without
      # a golden, or an intentional visual change, gets its golden here.
      - name: Render proposed CI goldens
        if: failure() && steps.wbtest.outcome == 'failure'
        continue-on-error: true
        working-directory: widgetbook
        run: flutter test --update-goldens --tags golden

      - name: Upload proposed CI goldens
        if: failure() && steps.wbtest.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ci-goldens
          path: widgetbook/test/goldens/ci/
          if-no-files-found: ignore

      - name: Build Widgetbook (build check, no deploy)
        working-directory: widgetbook
        run: flutter build web

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
