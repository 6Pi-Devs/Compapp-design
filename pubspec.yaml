name: compapp_design
description: Compapp design system - design tokens and atomic widgets for the Compapp Flutter app.
publish_to: none

version: 0.1.0

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - fonts/OFL-BricolageGrotesque.txt
    - fonts/OFL-InstrumentSans.txt

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: fonts/BricolageGrotesque-Variable.ttf
          weight: 600
    - family: Instrument Sans
      fonts:
        - asset: fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: fonts/InstrumentSans-SemiBold.ttf
          weight: 600
